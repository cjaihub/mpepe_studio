syntax = "proto3";
package cj_grader.orchestrator;

service Orchestrator {
  rpc SubmitPrompt(PromptRequest) returns (PromptResponse);
  // Server-streaming: emits a PlanEvent for each step as the Executor runs it.
  rpc StreamPlanEvents(StreamRequest) returns (stream PlanEvent);
  // Unary calls for step confirmation (Track 1)
  rpc ConfirmStep(ConfirmRequest) returns (ConfirmResponse);
  rpc RejectStep(RejectRequest) returns (ConfirmResponse);
}

message PromptRequest {
  string prompt = 1;
  string timeline_id = 2;
  int32 track_index = 3;
  int32 clip_index = 4;
  string scope = 5; // "clip" or "timeline"
  bool guided_mode = 6;
}

message PromptResponse {
  bool accepted = 1;
  string task_id = 2;
  string message = 3;
}

message StreamRequest {
  string task_id = 1;
}

// A single step event streamed from the executor to the Flutter UI.
message PlanEvent {
  string task_id = 1;
  int32 step_index = 2;
  int32 total_steps = 3;
  string agent = 4;
  string task_description = 5;
  // PENDING | RUNNING | WAITING_CONFIRMATION | DONE | ERROR
  string status = 6;
  string detail = 7;
}

message ConfirmRequest {
  string task_id = 1;
  int32 step_index = 2;
}

message RejectRequest {
  string task_id = 1;
  int32 step_index = 2;
  string reason = 3;
}

message ConfirmResponse {
  bool success = 1;
  string message = 2;
}
