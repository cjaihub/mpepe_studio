syntax = "proto3";
package cj_grader;

// ─────────────────────────────────────────────────────────────────────────────
// Skills Service — Analyze reference images into reusable grade profiles
// ─────────────────────────────────────────────────────────────────────────────

service SkillsService {
  rpc AnalyzeAndSaveSkill (SkillAnalysisRequest) returns (Skill);
  rpc ListSkills          (Empty)                returns (SkillList);
  rpc ApplySkill          (ApplySkillRequest)    returns (ApplySkillResponse);
  rpc DeleteSkill         (SkillId)              returns (DeleteResponse);
  rpc GetSkill            (SkillId)              returns (Skill);
}

message Empty {}

message SkillAnalysisRequest {
  bytes  image_data  = 1;  // JPEG/PNG reference image
  string mime_type   = 2;  // e.g. "image/jpeg"
  string name        = 3;  // User-chosen name: "Venice Film", "Golden Hour"
  repeated string tags = 4; // Optional style tags: ["warm", "filmic"]
}

message Skill {
  int32  id          = 1;
  string name        = 2;
  string description = 3;  // AI-generated description of the look
  repeated string tags = 4;
  string cdl_json    = 5;  // JSON: {slope_r, slope_g, ...}
  string created_at  = 6;
  string thumbnail_b64 = 7; // base64-encoded 120×80 thumbnail
}

message SkillList {
  repeated Skill skills = 1;
}

message ApplySkillRequest {
  int32  skill_id    = 1;
  string timeline_id = 2;
  int32  track_index = 3;
  int32  clip_index  = 4;
  int32  node_index  = 5;
}

message ApplySkillResponse {
  bool   success = 1;
  string message = 2;
  string skill_name = 3;
}

message SkillId {
  int32 id = 1;
}

message DeleteResponse {
  bool   success = 1;
  string message = 2;
}
