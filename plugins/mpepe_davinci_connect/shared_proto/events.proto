syntax = "proto3";
package cj_grader.events;

service LiveThinking {
  rpc StreamEvents(StreamRequest) returns (stream Event);
}

message StreamRequest {
  string session_id = 1;
}

message Event {
  string event_type = 1; // thought, tool_call, tool_result, error, milestone
  string agent_id = 2;
  string content = 3;
  string timestamp = 4;
  string task_id = 5;
}
