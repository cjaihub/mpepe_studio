name: Oneova Desktop Release (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Oneova Windows Desktop Assistant
        shell: pwsh
        run: |
          if (!(Test-Path ".env")) {
            @(
              "META_REDIRECT_URI=https://mpepe-2b4bd.web.app/meta-callback",
              "TIKTOK_REDIRECT_URI=oneova://tiktok-callback"
            ) | Set-Content -Path ".env" -Encoding UTF8
          }
          flutter pub get
          powershell -ExecutionPolicy Bypass -File tools/desktop/build_windows.ps1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $iscc) {
            & $iscc tools/desktop/windows_installer.iss
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Oneova-Desktop-Windows-x64
          path: |
            public/downloads/Oneova-Desktop-Windows-x64.zip
            public/downloads/Oneova-Desktop-Windows-Setup.exe
          if-no-files-found: ignore

  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Oneova macOS Desktop Assistant
        run: |
          if [ ! -f ".env" ]; then
            printf "META_REDIRECT_URI=https://mpepe-2b4bd.web.app/meta-callback\nTIKTOK_REDIRECT_URI=oneova://tiktok-callback\n" > .env
          fi
          flutter pub get
          flutter config --enable-macos-desktop
          flutter build macos --release
          mkdir -p build/dmg_staging public/downloads
          cp -R build/macos/Build/Products/Release/OneOva.app build/dmg_staging/Oneova.app
          ln -s /Applications build/dmg_staging/Applications
          hdiutil create -volname "Oneova Desktop Assistant" -srcfolder build/dmg_staging -ov -format UDBZ public/downloads/Oneova-Desktop-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Oneova-Desktop-macOS
          path: public/downloads/Oneova-Desktop-macOS.dmg

  publish_release:
    needs: [build_windows, build_macos]
    if: always() && startsWith(github.ref, 'refs/tags/desktop-v') && (needs.build_windows.result == 'success' || needs.build_macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: 'true'
          files: |
            release-artifacts/**/*
