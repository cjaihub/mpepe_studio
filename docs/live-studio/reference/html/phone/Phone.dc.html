<style>
body{margin:0;background:#08080A}
a{color:#FF2D75}a:hover{color:#FF4D8D}
@keyframes ss-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes ss-float{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1.1)}}
.ss-dot{animation:ss-pulse 1.4s ease-in-out infinite}
.ss-heart{animation:ss-float 3.2s ease-out infinite}
.ss-tile{transition:box-shadow .2s ease,border-color .2s ease}
.ss-tile:hover{box-shadow:0 0 0 2px #FF2D75,0 0 22px rgba(255,45,117,.6),0 12px 28px rgba(0,0,0,.75) !important}
.ss-tile:focus-visible,.ss-btn:focus-visible{outline:2px solid #00F0FF;outline-offset:2px}
.ss-btn{transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease}
.ss-btn:active{transform:scale(.98)}
.ss-ghost:hover{background:rgba(255,45,117,.08) !important;color:#FF2D75 !important}
.ss-sec:hover{border-color:#FF2D75 !important}
.ss-blue:hover{background:#4D8FFF !important;box-shadow:0 0 18px rgba(47,123,255,.55) !important}
.ss-exp:hover{background:#2F7BFF !important}
@keyframes ss-eq{0%,100%{height:30%}50%{height:100%}}
.ss-eq span{border-radius:2px;height:40%;animation:ss-eq .9s ease-in-out infinite}
.ss-eq span:nth-child(2){animation-delay:.25s}
.ss-eq span:nth-child(3){animation-delay:.5s}
@keyframes ss-rise{0%{opacity:0;transform:translateY(18px) scale(.96)}100%{opacity:1;transform:none}}
.ss-rise{animation:ss-rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes ss-up{0%{transform:translateY(100%)}100%{transform:none}}
.ss-up{animation:ss-up .32s cubic-bezier(.2,.8,.2,1) both}
.ss-pri:hover{background:#FF4D8D !important;box-shadow:0 0 16px rgba(255,45,117,.4)}
.ss-in::placeholder{color:#6b6b7e}
.ss-in:focus{outline:none;border-color:#FF2D75 !important;box-shadow:0 0 0 3px rgba(255,45,117,.2)}
.ss-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

      hostRim: Math.round((2 * fw / 0.66 + 4) * 10) / 10,
      popOpen: !!P,
      popIsPerson: !!popPerson,
      popIsTable: !!(P && P.table),
      popTitle: popPerson ? popPerson.name : stage.tag,
      popBg: popPerson ? popPerson.bg : '#0b0b0f',
      popFull: isFull,
      popNotFull: !isFull,
      popCursor: isFull ? 'default' : 'move',
      fullLabel: isFull ? 'Exit full screen' : 'Full screen',
      popBox: isFull ? 'left: 0; top: 0; width: 100%; height: 100%; border-radius: 20px' : 'left: ' + wn.x + 'px; top: ' + wn.y + 'px; width: ' + wn.w + 'px; height: ' + wn.h + 'px; border-radius: 14px',
      toggleFull: function () { self.setState({ full: !self.state.full }); },
      closePop: function () { self.setState({ pop: null, full: false }); },
      openTable: function () { self.setState({ pop: { table: true }, full: false, win: { x: 20, y: 120, w: 350, h: 240 } }); },
      dragStart: function (e) { self.dragWin(e, 'move'); },
      resizeStart: function (e) { e.stopPropagation(); self.dragWin(e, 'size'); }
    };
    var send = function () {
      var v = (self.state.draft || '').trim();
      if (!v) return;
      var c = self.state.comments.concat([{ id: Date.now(), who: 'You', text: v, sys: false }]).slice(-200);
      self.setState({ comments: c, draft: '' });
    };
    var comments = this.state.comments.map(function (c) {
      return Object.assign({}, c, { initial: c.who.charAt(0).toUpperCase(), msg: !c.sys });
    });
    return Object.assign({
      s0: slot(0), s1: slot(1), s2: slot(2), s3: slot(3), s4: slot(4), s5: slot(5), s6: slot(6),
      tabs: tabs,
      t0: tabs[0], t1: tabs[1], t2: tabs[2], t3: tabs[3], t4: tabs[4],
      comments: comments,
      draft: this.state.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      onKey: function (e) { if (e.key === 'Enter') send(); },
      send: send,
      loved: this.state.love > 0,
      loveCount: this.state.love,
      addLove: function () { self.setState({ love: self.state.love + 1 }); },
      openGoods: function () { self.setState({ tab: 'goods' }); },
      m0: modes[0], m1: modes[1], m2: modes[2], m3: modes[3],
      stage: stage,
      shareScreen: function () { self.setState({ mode: 'screen' }); },
      dim: 'background: rgba(8,8,10,' + (this.props.studioDim ?? 0.15) + ')',
      showNames: this.props.showNames ?? true
    }, popVals, {
      drawer: this.state.drawer,
      openDrawer: function () { self.setState({ drawer: true }); },
      shareLive: function () { self.setState({ comments: self.state.comments.concat([{ id: Date.now(), who: 'You', text: 'shared this live', sys: true }]).slice(-200) }); },
      followLabel: this.state.follow ? 'Following' : 'Follow',
      followStyle: this.state.follow ? 'background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #FFFFFF' : 'background: #FF2D75; border: 1px solid #FF2D75; color: #FFFFFF',
      toggleFollow: function () { self.setState({ follow: !self.state.follow }); },
      openPeople: function () { self.setState({ tab: 'people', drawer: true }); },
      sendSpark: function () { self.setState({ comments: self.state.comments.concat([{ id: Date.now(), who: 'You', text: 'sent sparkles', sys: true }]).slice(-200) }); },
      closeDrawer: function () { self.setState({ drawer: false }); }
    });
  }
}
</script>
</body>
</html>
