name: oneova_media_engine
description: "Oneova Media Engine: on-device video export (trim, speed, color, crop, overlays, audio mix) on Android Media3 Transformer."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.oneova.mediaengine
        pluginClass: OneovaMediaEnginePlugin
