name: oneova_camera_kit
description: "Oneova Camera Kit: native GPU Look processing for Live and Camera (Android GLES 3, iOS Metal)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # The native processors attach to flutter_webrtc's local video tracks.
  flutter_webrtc: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.oneova.camerakit
        pluginClass: OneovaCameraKitPlugin
      ios:
        pluginClass: OneovaCameraKitPlugin
