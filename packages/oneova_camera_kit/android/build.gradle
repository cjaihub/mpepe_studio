group 'com.oneova.camerakit'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Same rule as flutter_webrtc: apply KGP only when AGP's built-in Kotlin is off.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.oneova.camerakit'
    compileSdkVersion 36

    defaultConfig {
        // GLES 3.0 (EGL image external ESSL3) is required by the processor;
        // CameraX needs 23.
        minSdkVersion 23
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    // Provided at runtime by the app through flutter_webrtc.
    compileOnly project(':flutter_webrtc')
    compileOnly 'io.github.webrtc-sdk:android:150.7871.01'

    // Native AR camera: CameraX for the camera streams, ML Kit for tracking.
    // Same versions as camera_android_camerax and the google_mlkit plugins.
    def camerax = '1.5.3'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta3'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
}
