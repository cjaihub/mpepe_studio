  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  cloud_firestore: ^6.9.0
  timeago: ^3.7.1
  shared_preferences: ^2.5.5
  qr: ^3.0.2
  url_launcher: ^6.3.2
  intl_phone_field: ^3.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_waveforms: ^2.0.2
  local_auth: ^3.0.2
