  signature: ^6.4.0
  path_provider: ^2.1.6
  image: ^4.9.2
  mobile_scanner: ^7.4.0
  pdf: ^3.13.0
  printing: ^5.15.0
  reorderable_grid_view: ^2.2.8
  flutter_secure_storage: ^11.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
